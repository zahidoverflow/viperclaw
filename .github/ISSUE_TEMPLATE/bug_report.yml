name: "🐛 Bug Report / False Positive"
description: "Report a bug, parser edge case, or false positive in ViperClaw"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: "Description"
      description: "What happened, and what did you expect to happen?"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: "CLI Command or MCP Tool Invoked"
      placeholder: "viperclaw taint ./repo"
  - type: textarea
    id: repro
    attributes:
      label: "Minimal Reproducible Code / Input"
      render: python
