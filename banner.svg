  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect width="1200" height="380" rx="16" fill="url(#grid)"/>

