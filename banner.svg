    <text x="92" y="22" text-anchor="middle" fill="#047857">▸ Antigravity Ready</text>

    <rect x="200" y="0" width="175" height="34" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
