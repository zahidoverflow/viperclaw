  <!-- Terminal Chrome Dots -->
  <circle cx="36" cy="28" r="6" fill="#ef4444"/>
  <circle cx="56" cy="28" r="6" fill="#f59e0b"/>
  <circle cx="76" cy="28" r="6" fill="#10b981"/>
  <text x="102" y="33" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">
